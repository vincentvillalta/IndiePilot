name: Neon Preview Branch

on:
  pull_request:
    types: [opened, reopened, synchronize, closed]

jobs:
  setup:
    if: github.event.action != 'closed'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'pnpm'

      - run: pnpm install --frozen-lockfile

      - name: Create Neon branch for PR
        id: create-branch
        uses: neondatabase/create-branch-action@v5
        with:
          project_id: ${{ secrets.NEON_PROJECT_ID }}
          branch_name: pr-${{ github.event.number }}
          api_key: ${{ secrets.NEON_API_KEY }}
          # Project has Neon Auth enabled (authenticator/anonymous/authenticated roles).
          # Pin to neondb_owner — same role our app uses via DATABASE_URL.
          # Database is `verceldb` (Vercel's Neon integration default name on main),
          # not `neondb`. PR branches fork from main, so they inherit `verceldb`.
          username: neondb_owner
          database: verceldb

      - name: Apply migrations
        env:
          DATABASE_URL: ${{ steps.create-branch.outputs.db_url_with_pooler }}
        run: pnpm db:migrate

      - name: Comment branch info on PR
        uses: actions/github-script@v7
        with:
          script: |
            github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: `Neon preview branch \`pr-${context.issue.number}\` ready. Migrations applied.`,
            });

  cleanup:
    if: github.event.action == 'closed'
    runs-on: ubuntu-latest
    steps:
      - name: Delete Neon branch
        uses: neondatabase/delete-branch-action@v3
        with:
          project_id: ${{ secrets.NEON_PROJECT_ID }}
          branch: pr-${{ github.event.number }}
          api_key: ${{ secrets.NEON_API_KEY }}
